<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta data-seo-static name="description"
    content="Vahoha: earn your developer roadmap layer by layer. Pass a graded test to unlock each step, with an AI mentor that knows your weak spots.">
  <meta name="theme-color" content="#000000" />
  <meta data-seo-static property="og:type" content="website" />
  <meta data-seo-static property="og:site_name" content="Vahoha" />
  <meta data-seo-static property="og:title" content="Vahoha" />
  <meta data-seo-static property="og:description"
    content="Pass a graded test to unlock each step, with an AI mentor that knows your weak spots." />
  <meta data-seo-static property="og:image" content="https://vahoha.com/og-image.png" />
  <meta data-seo-static property="og:image:width" content="1200" />
  <meta data-seo-static property="og:image:height" content="630" />
  <meta data-seo-static name="twitter:card" content="summary_large_image" />
  <meta data-seo-static name="twitter:title" content="Vahoha" />
  <meta data-seo-static name="twitter:description"
    content="Pass a graded test to unlock each step, with an AI mentor that knows your weak spots." />
  <meta data-seo-static name="twitter:image" content="https://vahoha.com/og-image.png" />
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://vahoha.com/#website",
            "url": "https://vahoha.com/",
            "name": "Vahoha",
            "description": "Earn your developer roadmap layer by layer, with graded tests and an AI mentor."
          },
          {
            "@type": "Organization",
            "@id": "https://vahoha.com/#organization",
            "name": "Vahoha",
            "url": "https://vahoha.com/",
            "logo": "https://vahoha.com/favicon-192.png"
          }
        ]
      }
    </script>
  <!-- Analytics origins used on every page: open the connections early. -->
  <link rel="preconnect" href="https://eu.i.posthog.com" crossorigin />
  <link rel="preconnect" href="https://eu-assets.i.posthog.com" crossorigin />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- While prerendered HTML is on the page, keep the booting app hidden. -->
  <style>
    #prerender~#root {
      display: none;
    }

    /* The prerendered navbar is the guest one. A returning user (session
         hint set by useAuthStore) shouldn't see its links flash, so they stay
         hidden (space kept, no layout shift) until the live app takes over. */
    .has-session #prerender .nav-guest {
      visibility: hidden;
    }
  </style>
  <title data-seo-static>Vahoha</title>
</head>

<body>
  <script>
    try {
      const t = localStorage.getItem("theme") || "dark";
      if (t === "dark") document.documentElement.classList.add("dark");
      if (localStorage.getItem("hasSession") === "1") {
        document.documentElement.classList.add("has-session");
      }
    } catch {
      document.documentElement.classList.add("dark");
    }
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
