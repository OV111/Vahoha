name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel an in-progress run when a newer commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      # Installs exactly what package-lock.json says (reproducible, unlike `npm install`).
      - run: npm ci

      - run: npm run lint
      # vite.config.js refuses a production build without these two. They are the
      # public API URLs that ship in the bundle anyway, not secrets.
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.vahoha.com
          VITE_WS_URL: wss://api.vahoha.com
      - run: npm run test:unit
