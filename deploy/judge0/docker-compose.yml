# Judge0 for Vahoha: runs learner code in Python, Ruby, PHP, Java, C++ and Go.
# Set up with setup.sh (see README.md); it puts judge0.conf next to this file.
#
# Only Caddy is reachable from outside (80/443). The Judge0 API, Postgres and
# Redis stay on the compose network, and every request to the API needs the
# X-Auth-Token set in judge0.conf.

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: 50M
      max-file: "3"

services:
  caddy:
    image: caddy:2.8.4
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      JUDGE0_DOMAIN: ${JUDGE0_DOMAIN:?set JUDGE0_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - server
    <<: *default-logging

  server:
    image: judge0/judge0:1.13.1
    restart: always
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    # Judge0 sandboxes each run with isolate, which needs a privileged container.
    privileged: true
    <<: *default-logging

  workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    restart: always
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    <<: *default-logging

  db:
    image: postgres:16.2
    restart: always
    env_file: judge0.conf
    volumes:
      - db-data:/var/lib/postgresql/data/
    <<: *default-logging

  redis:
    image: redis:7.2.4
    restart: always
    command: ["bash", "-c", 'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"']
    env_file: judge0.conf
    <<: *default-logging

volumes:
  caddy-data:
  db-data:
